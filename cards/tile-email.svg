<svg xmlns="http://www.w3.org/2000/svg" width="290" height="128" viewBox="0 0 290 128" role="img" aria-label="Email: gauravboy1122@gmail.com">
<title>Email: gauravboy1122@gmail.com</title>
<style>@font-face{font-family:fira;font-weight:400;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:fira;font-weight:600;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:inter;font-weight:800;src:url(data:font/woff;base64,) format('woff')}

@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}}
@keyframes col{from{opacity:0;transform:translateY(8px)}}
.up,.fade,.grow,.pop,.type,.col{animation-fill-mode:both;animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
.up{animation-name:up}
.fade{animation-name:fade}
.grow{animation-name:grow;animation-duration:.9s;transform-box:fill-box;transform-origin:50% 100%}
.pop{animation-name:pop;animation-duration:.5s;transform-box:fill-box;transform-origin:50% 50%}
.type{animation-name:type;animation-duration:1s;animation-timing-function:steps(17,end)}
.col{animation-name:col;animation-duration:.45s}
@media (prefers-reduced-motion:reduce){.up,.fade,.grow,.pop,.type,.col{animation:none!important}.smil{display:none}}
</style>
<defs></defs>
<rect x=".5" y=".5" width="289" height="127" rx="16" fill="#12161d" stroke="#262c37"/><g class="up" style="animation-delay:0.99s"><rect x="22" y="22" width="40" height="40" rx="11" fill="#FF6B6B" fill-opacity=".14"/><text x="42" y="47.8" font-family="fira, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" font-size="16" text-anchor="middle" ><tspan fill="#FF6B6B">@</tspan></text><path d="M254 36 L266 24 M255.8 24 H266 V34.2" fill="none" stroke="#8b93a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="22" y="96" font-family="inter, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="800" font-size="19" ><tspan fill="#eceef2">Email</tspan></text><text x="22" y="115" font-family="fira, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" font-size="12" ><tspan fill="#8b93a1">gauravboy1122@gmail.com</tspan></text></g>
<g class="smil"><rect x="22" y="70" width="20" height="2" rx="1" fill="#FF6B6B" opacity="0"><set attributeName="opacity" to="1" begin="1.79s"/><animate attributeName="width" values="20;56;20" dur="3.6s" begin="3.3s" repeatCount="indefinite"/></rect></g>
</svg>
