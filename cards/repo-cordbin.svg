family="fira, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" font-size="11" ><tspan fill="#eceef2">Express</tspan></text></g><g class="pop" style="animation-delay:3.17s"><rect x="687.8" y="111" width="66.2" height="24" rx="12" fill="#171c25" stroke="#262c37"/><text x="697.8" y="127.5" font-family="fira, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" font-size="11" ><tspan fill="#eceef2">MongoDB</tspan></text></g><g class="pop" style="animation-delay:3.23s"><rect x="762" y="111" width="86" height="24" rx="12" fill="#171c25" stroke="#262c37"/><text x="772" y="127.5" font-family="fira, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" font-size="11" ><tspan fill="#eceef2">Discord.js</tspan></text></g>

